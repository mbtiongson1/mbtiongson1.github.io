<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership — dev harness</title>
<!--
  Development harness for the Leadership island (#600, slice C). It is NEVER part of a
  production package; ops/leadership-island-production.json lists it under excludedFromProduction.

  Serve the repository root over loopback and open
  /apps/leadership-island/capture/leadership-shell.html — ES modules do not load over file://.

      python3 -m http.server 8600

  Everything drawn here is fictional. The bundle is generated by
  apps/leadership-island/build-fictional-bundle.mjs and every name in it is invented, because the
  peg this dashboard was built from carries 762 real ones and is never committed.

  This harness mounts the island STANDALONE, without the People & Leaders shell, which is the
  point: the island has to be a complete dashboard on its own, or the seam between it and the
  shell is in the wrong place. To exercise it inside the shell instead, open
  /apps/people-shell/shell-dev.html#tab=leadership.
-->
<link rel="stylesheet" href="./leadership.css">
<style>
  body { margin: 0; background: var(--background, #fef1e8); }
  .harness-flag {
    margin: 0; padding: .5rem 1rem;
    font: 700 .75rem/1.4 "Favor Sans", Arial, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
    background: #121411; color: #fef1e8;
  }
</style>
</head>
<body>
<p class="harness-flag">Fictional prototype data. Development harness, not a production surface.</p>
<div id="leadership-root"></div>

<script type="module">
  import { boot } from "./leadership-boot.mjs";

  const [bundle, servingAreas] = await Promise.all([
    fetch("./bundle-fictional.json").then((r) => r.json()),
    fetch("../../../ops/serving-areas.json").then((r) => r.json()),
  ]);

  /* ops/serving-areas.json is the reviewed mapping of which status on each serving area means
     "placed". The production wrapper embeds it; here it is fetched, because a harness that
     hard-coded it would stop exercising the one path chapter 3 depends on. */
  bundle.servingAreas = servingAreas;

  await boot(document.getElementById("leadership-root"), bundle);
</script>
</body>
</html>
