<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Inputs · Sunday Inputs prototype</title>
<!--
THESIS: Stats is a weekly inbox, not a form. The default view answers "what do I own, what is unfinished, did it save, am I done" in one glance; the data model (Teams, Stats, services, partitions) stays behind All inputs and Setup. It refuses the category default: a mode switch plus a grid.
OWN-WORLD: the 2026 Favor system, restrained. Cream ground, ink shell, white cards with hairline rules, orange for the one primary action and selection, green/amber/red for complete/attention/failed. Favorvetica for the headline and every numeral, Favor Sans for the rest. No colour flood per app or per mode.
STORY: open, see this Sunday and the campus, unfinished cards first, tap one, type big numerals, Save and finish, a receipt with a name and a time, Next, all caught up.
FIRST VIEWPORT (390): ink strip with the burst mark and "Sunday Inputs"; two scope chips; "Sunday, Sep 20" in Favorvetica with "Manila"; the progress line and bar; the first unfinished card with Continue. Wide: inbox left, the focused entry sticky on the right.
FORM: inbox ledger with master-detail on wide screens, structure pinned by #677 (concept roll aa7495e4 consulted and declined on brief-pinned grounds).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<link rel="stylesheet" href="proto.css">
<link rel="stylesheet" href="../../../apps/stats_inputs/src/ui/shared/inputs-tokens.css">
<link rel="stylesheet" href="../../../apps/stats_inputs/src/ui/shared/inputs-base.css">
</head>
<body>
<main id="app" class="favor-inputs"></main>
<nav class="proto-nav" aria-label="Prototype screens"><a href="index.html" aria-current="page">1 · My Inputs</a><a href="entry.html">2 · Entry</a><a href="setup.html">3 · Setup</a></nav>
<script src="../../../apps/stats_inputs/src/ui/shared/inputs-inbox.js"></script>
<script src="data.js"></script>
<script src="proto-render.js"></script>
<script>
(function () {
  var R = window.PROTO_RENDER;
  var app = document.getElementById("app");
  R.shell(app);
  var page = R.el("div", "in-page");
  var layout = R.el("div", "in-layout");
  var left = R.el("div");
  R.scope(left);
  var c = R.home(left);
  layout.appendChild(left);
  var detail = R.el("aside", "in-detail");
  detail.setAttribute("aria-label", "Focused entry");
  var first = c.items.filter(function (i) { return !i.complete; })[0];
  if (first && window.matchMedia("(min-width: 60rem)").matches) {
    R.entry(detail, first.key, { inPane: true });
    layout.appendChild(detail);
    left.querySelectorAll(".in-card").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault(); e.stopImmediatePropagation();
        detail.innerHTML = "";
        R.entry(detail, btn.getAttribute("data-key"), { inPane: true });
        detail.querySelector("input") && detail.querySelector("input").focus();
      }, true);
    });
  }
  page.appendChild(layout);
  app.appendChild(page);
  window.PROTO_STATUS = R.mountStatus(app);
}());
</script>
</body>
</html>
